spring:
  application:
    name: policy-management-api
  datasource:
    url: jdbc:h2:mem:policies;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    api-key: ${POLICY_API_KEY:123456}
  core:
    base-url: ${CORE_BASE_URL:http://localhost:${server.port}}
    connect-timeout: 2s
    read-timeout: 3s
    dispatch-delay-ms: 1000
    max-attempts: 5
    dispatch-enabled: ${CORE_DISPATCH_ENABLED:true}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace=%X{traceId:-none} logger=%logger{36} message=\"%msg\"%n"
