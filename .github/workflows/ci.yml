name: CI

on:
  push:
    branches: ["main", "feature/**", "chore/**", "docs/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile, test, and generate coverage report
        run: mvn --batch-mode --no-transfer-progress verify

