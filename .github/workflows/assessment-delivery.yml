# Tests pushes to the submitted assessment branch and uploads build evidence.
name: Assessment delivery
on:
  push:
    branches: ['assessment/final-2026-09-16']
permissions:
  contents: read
concurrency:
  group: assessment-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B -ntp verify
      - name: Package tracked source
        if: always()
        run: |
          mkdir -p delivery
          git archive --format=zip --prefix=seguros-bolivar-challenge/ HEAD -o delivery/source.zip
          git rev-parse HEAD > delivery/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-delivery
          path: |
            delivery/
            target/surefire-reports/
            target/site/jacoco/
            target/policy-management-api-1.0.0.jar
          retention-days: 14
          if-no-files-found: error
